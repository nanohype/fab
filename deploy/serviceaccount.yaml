# Namespace + ServiceAccount for fab workloads running inside the cluster.
#
# The ServiceAccount carries no `eks.amazonaws.com/role-arn` annotation. AWS
# credentials arrive via an EKS Pod Identity association, which binds this
# ServiceAccount to an IAM role outside the manifest — so the role ARN is not
# pasted into cluster state, and rotating or repointing the role does not touch
# this file. `src/standards/llm-policy.json` names Pod Identity as the auth
# mechanism on EKS, and this is the shape fab instructs every factory agent to
# emit (see PLATFORM_TENANT_CONTRACT in src/standards.ts).
#
# The role itself is a standard workload IAM role: a trust policy for the
# `pods.eks.amazonaws.com` service principal, and a permission policy granting
# `bedrock:InvokeModel` + `bedrock:InvokeModelWithResponseStream` on the Claude
# models in use. Provision it in the cloud-infra layer alongside other workload
# IAM roles. See docs/runbook.md ("Bedrock prerequisites") for the association.
apiVersion: v1
kind: Namespace
metadata:
  name: fab
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fab
  namespace: fab
