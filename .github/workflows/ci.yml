name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# The factory's FOUR_PHASE_CONTRACT wants build / lint / test / docs as
# distinct executable phases that exit 0 from a clean checkout — eat our own
# dogfood and run each as its own job, plus the format check and the npm
# audit hard gate. Every job is required; none is advisory.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      # The vendored standard has to still be the file it claims to be a copy
      # of. Reads upstream at the PINNED ref, never at its head, so this stays
      # a verdict about the commit under test — a push to nanohype cannot turn
      # it red. `standards:freshness` asks that separate question on its own
      # schedule.
      - run: npm run standards:check

  # The skills go into the preamble of every agent session fab runs, so a kind
  # named there is a kind agents will confidently author. When the batch tier was
  # deleted upstream, `BatchJob` survived in the curation skill and every session
  # kept being told the platform had a batch API. fab vendors no CRDs, so there
  # was no local list to compare against — this fetches one.
  #
  # Checked in both directions. A kind the skills name that no CRD defines is the
  # batch case; a kind the operator ships that no skill mentions is the quieter
  # half, and it is how SLOPolicy came to have a controller, a CRD, a
  # kube-state-metrics projection and three alerts while nothing ever authored one.
  skill-resources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - name: Checkout the operator chart's CRDs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: nanohype/eks-agent-platform
          path: eks-agent-platform
          sparse-checkout: charts/operator/crds
          sparse-checkout-cone-mode: false
      - run: node scripts/check-skill-resources.mjs eks-agent-platform/charts/operator/crds

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Coverage floors are enforced by vitest.config.ts thresholds — a drop
      # below the floor fails this job.
      - run: npm run test:coverage

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run docs

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check

  # Hard gate: any high-severity advisory in the production dependency tree
  # fails CI — no allowlist, no continue-on-error.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high --omit=dev

  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      # PRs validate the build (both arches) but don't publish; pushes to main
      # and tags publish a multi-arch image to GHCR. arm64 is required — the
      # eks-agent-platform spokes run on Graviton, so an amd64-only image
      # CrashLoops with exec-format error on the AgentSandbox pod.
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/nanohype/fab
          tags: |
            type=ref,event=branch
            type=sha
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build (and push on main / tags)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      # Keyless cosign signature + SBOM attestation on the pushed multi-arch
      # image, by digest (immutable, covers the manifest list). Push-only — PRs
      # build but never publish, so there's nothing to sign. Matches the
      # eks-agent-platform operator release so cluster verify-images policies
      # (Kyverno) accept the fab image too.
      - name: Install cosign
        if: github.event_name == 'push'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Install syft
        if: github.event_name == 'push'
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0
      - name: Sign + SBOM-attest the image (keyless, by digest)
        if: github.event_name == 'push'
        env:
          IMAGE_DIGEST: ghcr.io/nanohype/fab@${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "${IMAGE_DIGEST}"
          syft "${IMAGE_DIGEST}" -o spdx-json > sbom.spdx.json
          cosign attest --yes --predicate sbom.spdx.json --type spdxjson "${IMAGE_DIGEST}"

  merge-gate:
    name: merge gate
    runs-on: ubuntu-latest
    needs:
      [
        build,
        skill-resources,
        lint,
        test,
        docs,
        format,
        audit,
        docker,
      ]
    # always() is load-bearing: without it a failed dependency SKIPS this job,
    # and GitHub counts a skipped check as passing for branch protection, so the
    # gate would report green exactly when something broke.
    #
    # Restricted to pull_request because the gate treats a skipped dependency as
    # a failure, and a job carrying `if: github.event_name == 'pull_request'` is
    # legitimately skipped on a push to main. The gate exists to gate merges, and
    # merges come from pull requests; on push it is skipped and gates nothing.
    if: always() && github.event_name == 'pull_request'
    steps:
      - uses: nanohype/.github/actions/merge-gate@6ec6c5b3e6c4a8b15e12da4afd7ac4870a630092 # main
        with:
          needs: ${{ toJSON(needs) }}
          gate-job-id: merge-gate
