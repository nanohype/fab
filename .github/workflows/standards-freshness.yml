name: Standards freshness
# Asks whether the vendored standard's pin is behind nanohype.
#
# Deliberately not part of CI. Pull-request CI verifies that the vendored copy
# and its pin agree with each other and with upstream AT THAT PIN — a verdict
# about the commit under test. Whether the pin is also the newest thing
# nanohype has is a different question with a different answer every day, and
# answering it in CI would turn a required check red because someone pushed to
# another repository.
#
# A red run here means: re-vendor, read the diff, and ship whatever it implies
# for the four-phase dispatch.
on:
  schedule:
    - cron: "0 15 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm run standards:freshness
