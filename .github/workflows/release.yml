name: Release

on:
  push:
    tags: ['v*']

permissions: {}

# The cluster verify-images policy admits a ghcr.io/nanohype image only when its
# Fulcio subject is a release.yml run on a tag ref, so the fab image is
# published and signed here and nowhere else. ci.yml builds the same image on
# every PR and push without publishing it.
jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # deploy/job.yaml, .env.example and the runbook pin
      # ghcr.io/nanohype/fab:<package.json version>, and __tests__/deploy-image.test.ts
      # holds them to it. A tag that disagrees with package.json would publish
      # an image nothing references.
      - name: Check the tag matches the package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="v$(jq -r .version package.json)"
          if [ "$TAG" != "$version" ]; then
            echo "::error::tag $TAG does not match package.json version $version"
            exit 1
          fi
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Only the immutable version tag: latest=false stops the action adding a
      # moving :latest alongside it.
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/nanohype/fab
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
      # arm64 is required: the eks-agent-platform spokes run on Graviton, so an
      # amd64-only image CrashLoops with exec-format error on the AgentSandbox pod.
      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      # cosign v3 writes Sigstore bundles, which the ImageValidatingPolicy reads
      # from the registry's referrers fallback tag.
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.1.4'
      - name: Install syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0
      # By digest: the manifest-list digest covers both architectures, and a tag
      # can move after signing while a digest cannot.
      - name: Sign the image and attest its SPDX SBOM
        env:
          IMAGE_REF: ghcr.io/nanohype/fab@${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "$IMAGE_REF"
          syft "$IMAGE_REF" -o spdx-json > sbom.spdx.json
          cosign attest --yes --predicate sbom.spdx.json --type spdxjson "$IMAGE_REF"
